name: Set up OpenSCAD snapshot
description: Install the pinned OpenSCAD snapshot (Manifold backend) and Xvfb, and put openscad on PATH.
runs:
  using: composite
  steps:
    - name: Install OpenSCAD snapshot
      shell: sh
      env:
        OPENSCAD_VERSION: '2026.09.23'
        OPENSCAD_SHA256: 033762f4e0b0de7a2c6cf2b5a12febb29d60ba62ede227d57b1c8b675a94710a
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb libegl1 libopengl0 libgl1 libglu1-mesa libxkbcommon0 libfontconfig1 libdbus-1-3 libharfbuzz0b
        curl -fsSL -o openscad.AppImage "https://files.openscad.org/snapshots/OpenSCAD-${OPENSCAD_VERSION}-x86_64.AppImage"
        echo "${OPENSCAD_SHA256}  openscad.AppImage" | sha256sum -c -
        chmod +x openscad.AppImage
        mkdir -p "$HOME/openscad-snapshot"
        (cd "$HOME/openscad-snapshot" && "$OLDPWD/openscad.AppImage" --appimage-extract >/dev/null)
        rm openscad.AppImage
        printf '#!/bin/sh\nexec "%s/openscad-snapshot/squashfs-root/AppRun" "$@"\n' "$HOME" > "$HOME/openscad-snapshot/openscad"
        chmod +x "$HOME/openscad-snapshot/openscad"
        echo "$HOME/openscad-snapshot" >> "$GITHUB_PATH"
        "$HOME/openscad-snapshot/openscad" --version
