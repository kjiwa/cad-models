name: Set up OpenSCAD
description: Install the pinned OpenSCAD snapshot (needed by onescad --verify) and Xvfb.
runs:
  using: composite
  steps:
    - name: Install OpenSCAD and Xvfb
      shell: sh
      env:
        OPENSCAD_VERSION: '2026.09.23'
        OPENSCAD_SHA256: 033762f4e0b0de7a2c6cf2b5a12febb29d60ba62ede227d57b1c8b675a94710a
      run: |
        set -eu
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb libegl1 libopengl0 libgl1 libglu1-mesa libxkbcommon0 libfontconfig1 libdbus-1-3
        curl -fsSL -o openscad "https://files.openscad.org/snapshots/OpenSCAD-${OPENSCAD_VERSION}-x86_64.AppImage"
        echo "${OPENSCAD_SHA256}  openscad" | sha256sum -c -
        chmod +x openscad
        mkdir -p "$HOME/.local/bin"
        mv openscad "$HOME/.local/bin/openscad"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
