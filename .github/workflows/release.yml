name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenSCAD and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad xvfb

      - name: Build all models
        run: xvfb-run -a make all

      - name: Package artifacts
        run: |
          mkdir -p dist
          find . -mindepth 2 -maxdepth 3 -type f \( -name "*.stl" -o -name "*.3mf" -o -name "*.png" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
