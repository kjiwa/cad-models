name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install OpenSCAD and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad xvfb

      - name: Install OpenSCAD snapshot
        uses: ./.github/actions/setup-openscad

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build and package artifacts
        run: |
          set -eu
          xvfb-run -a make all
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen PATH="$HOME/openscad-snapshot:$PATH" xvfb-run -a make dist

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
