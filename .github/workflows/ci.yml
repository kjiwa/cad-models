name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install OpenSCAD snapshot
        uses: ./.github/actions/setup-openscad

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run unit tests
        env:
          OPENSCADPATH: ${{ github.workspace }}/lib
        run: xvfb-run -a uvx --with pytest-xdist==3.8.0 pytest==9.1.1 -n auto -q --durations 15 tests

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install OpenSCAD snapshot
        uses: ./.github/actions/setup-openscad

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Bundle and verify models
        env:
          OPENSCADPATH: ${{ github.workspace }}/lib
        run: |
          nproc
          xvfb-run -a make -j"$(nproc)" bundle

      - name: Build models
        env:
          OPENSCADPATH: ${{ github.workspace }}/lib
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ] && git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
            BASE="origin/${GITHUB_BASE_REF}"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${GITHUB_EVENT_BEFORE}" >/dev/null 2>&1; then
            BASE="${GITHUB_EVENT_BEFORE}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE="HEAD~1"
          else
            BASE=""
          fi

          BUILD_ALL=false
          TARGETS=""

          if [ -z "$BASE" ]; then
            BUILD_ALL=true
          else
            if git diff --name-only "$BASE"...HEAD | grep -qE '^(\.gitmodules|Makefile|common\.mk|scripts/|lib/|\.github/)'; then
              BUILD_ALL=true
            else
              TARGETS=$(git diff --name-only "$BASE"...HEAD | grep "^models/" | cut -d/ -f2 | sort -u | while read -r dir; do
                if [ -n "$dir" ] && [ -f "models/$dir/Makefile" ]; then
                  echo "$dir"
                fi
              done)
            fi
          fi

          if [ "$BUILD_ALL" = true ]; then
            echo "Building all models..."
            xvfb-run -a make -j"$(nproc)" all
          elif [ -n "$TARGETS" ]; then
            echo "Building changed models: $TARGETS"
            # shellcheck disable=SC2086
            xvfb-run -a make -j"$(nproc)" $TARGETS
          else
            echo "No CAD models changed. Skipping build."
          fi

  compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad

      - name: Evaluate models and presets
        env:
          OPENSCADPATH: ${{ github.workspace }}/lib
        run: |
          openscad --version
          make -j"$(nproc)" check

  privacy:
    uses: kjiwa/.github/.github/workflows/privacy.yml@main
