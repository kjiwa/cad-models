name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Install OpenSCAD and Xvfb
        uses: ./.github/actions/setup-openscad

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run unit tests
        env:
          OPENSCADPATH: ${{ github.workspace }}/lib
        run: xvfb-run -a python3 -m unittest discover

      - name: Bundle and verify models
        env:
          OPENSCADPATH: ${{ github.workspace }}/lib
        run: make bundle

      - name: Build models
        env:
          OPENSCADPATH: ${{ github.workspace }}/lib
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ] && git rev-parse --verify "origin/${GITHUB_BASE_REF}" >/dev/null 2>&1; then
            BASE="origin/${GITHUB_BASE_REF}"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "${GITHUB_EVENT_BEFORE}" >/dev/null 2>&1; then
            BASE="${GITHUB_EVENT_BEFORE}"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE="HEAD~1"
          else
            BASE=""
          fi

          BUILD_ALL=false
          TARGETS=""

          if [ -z "$BASE" ]; then
            BUILD_ALL=true
          else
            if git diff --name-only "$BASE"...HEAD | grep -qE '^(\.gitmodules|Makefile|common\.mk|scripts/|lib/|\.github/)'; then
              BUILD_ALL=true
            else
              TARGETS=$(git diff --name-only "$BASE"...HEAD | cut -d/ -f1 | sort -u | while read -r dir; do
                if [ -n "$dir" ] && [ -f "$dir/Makefile" ]; then
                  echo "$dir"
                fi
              done)
            fi
          fi

          if [ "$BUILD_ALL" = true ]; then
            echo "Building all models..."
            xvfb-run -a make all
          elif [ -n "$TARGETS" ]; then
            echo "Building changed models: $TARGETS"
            for target in $TARGETS; do
              echo "==> Building $target"
              xvfb-run -a make "$target"
            done
          else
            echo "No CAD models changed. Skipping build."
          fi

  privacy:
    uses: kjiwa/.github/.github/workflows/privacy.yml@main
